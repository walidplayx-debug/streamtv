name: Clean old Actions runs (whole account)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Keep the latest five runs across the account
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs across owned repositories
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_CLEANUP_TOKEN }}
          script: |
            const owner = context.repo.owner;

            const repos = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { affiliation: 'owner', per_page: 100 }
            );

            const allRuns = [];
            for (const repository of repos) {
              if (repository.owner.login.toLowerCase() !== owner.toLowerCase()) continue;

              try {
                const runs = await github.paginate(
                  github.rest.actions.listWorkflowRunsForRepo,
                  { owner, repo: repository.name, per_page: 100 }
                );
                for (const run of runs) {
                  allRuns.push({
                    id: run.id,
                    name: run.name,
                    created_at: run.created_at,
                    repo: repository.name,
                    status: run.status
                  });
                }
              } catch (error) {
                core.warning(`Could not list runs in ${repository.full_name}: ${error.message}`);
              }
            }

            allRuns.sort((a, b) =>
              new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
            );

            const toDelete = allRuns.slice(5);
            let deleted = 0;
            const failed = [];

            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo: run.repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted ${run.repo} run #${run.id}: ${run.name}`);
              } catch (error) {
                failed.push({ repo: run.repo, id: run.id, message: error.message });
                core.warning(`Could not delete ${run.repo} run #${run.id}: ${error.message}`);
              }
            }

            await core.summary
              .addHeading('Account-wide Actions cleanup')
              .addTable([
                [{ data: 'Item', header: true }, { data: 'Count', header: true }],
                ['Repositories scanned', String(repos.filter(r => r.owner.login.toLowerCase() === owner.toLowerCase()).length)],
                ['Runs found', String(allRuns.length)],
                ['Runs retained account-wide', String(Math.min(5, allRuns.length))],
                ['Runs deleted', String(deleted)],
                ['Could not delete', String(failed.length)]
              ])
              .write();

            if (failed.length) {
              core.warning(`${failed.length} run(s) could not be deleted. See the log above.`);
            }
