name: Android build
# Every push to main is built, checked and published as the "latest" release (stv.apk).
# The download link is fixed and works without a GitHub login; the app updates from it.
concurrency:
  group: streamtv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/private.jks"
            echo "STV_KEYSTORE_FILE=$RUNNER_TEMP/private.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from the repository secrets"
          else
            echo "::error::The signing secrets are missing. Refusing to build an APK that the installed app could not update to."
            exit 1
          fi
      - name: Build, lint and test
        env:
          STV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
      - name: Check the signed APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/app.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/app.apk
          ls -l release/app.apk
          test "$(stat -c %s release/app.apk)" -gt 1000000
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/app.apk release/stv.apk
          NOTES="Version code: $GITHUB_RUN_NUMBER
          Commit: $GITHUB_SHA
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA-256: $(sha256sum release/stv.apk | cut -d' ' -f1)"
          # Move the fixed tag to this commit, then replace the file on the same release.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --verify-tag --title "STV latest" --notes "$NOTES" --latest
          fi
          gh release upload latest release/stv.apk --clobber
          gh release edit latest --title "STV latest" --notes "$NOTES" --draft=false --prerelease=false --latest
          echo "Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/stv.apk" >> "$GITHUB_STEP_SUMMARY"
