name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13
      - name: Build, lint and test
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
      - name: Commit generated Gradle wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: add Gradle wrapper"
            git push origin HEAD:main
          fi
      - name: Sign APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release/signing.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            PASS="$KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore release/temporary.jks -storepass streamtv-temp -keypass streamtv-temp -alias streamtv -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=streamtv, OU=Build, O=streamtv, L=Unknown, S=Unknown, C=US"
            STORE_PASS="streamtv-temp"
            ALIAS="streamtv"
            PASS="streamtv-temp"
            mv release/temporary.jks release/signing.jks
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks release/signing.jks --ks-pass "pass:$STORE_PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out release/streamtv.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/streamtv.apk
          rm -f release/signing.jks
      - name: Upload APK artifact
        if: always() && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: streamtv-apk
          path: release/streamtv.apk
          if-no-files-found: ignore
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: streamtv latest
          target_commitish: main
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: release/streamtv.apk
