name: Android build
# Every push is built. main publishes the "latest" release (stv.apk) and also refreshes the
# "preview" pre-release (stv-preview.apk), so apps installed from either one keep updating.
# Any other branch publishes only "preview". Both download links are fixed and work without
# a GitHub login.
concurrency:
  group: streamtv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/cleanup-old-actions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/private.jks"
            echo "STV_KEYSTORE_FILE=$RUNNER_TEMP/private.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from the repository secrets"
          else
            echo "::error::The signing secrets are missing. Refusing to build an APK that the installed app could not update to."
            exit 1
          fi
      - name: Build, lint and test
        env:
          STV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
      - name: Check the signed APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/app.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/app.apk
          ls -l release/app.apk
          test "$(stat -c %s release/app.apk)" -gt 1000000
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            TAG=$1; ASSET=$2; TITLE=$3; FLAGS=$4
            cp release/app.apk "release/$ASSET"
            NOTES="Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA-256: $(sha256sum "release/$ASSET" | cut -d' ' -f1)"
            # Move the fixed tag to this commit, then replace the file on the same release.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --title "$TITLE" --notes "$NOTES" $FLAGS
            fi
            gh release upload "$TAG" "release/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --draft=false $FLAGS
            # Old file name from earlier builds; the fixed name is stv.apk now.
            gh release delete-asset "$TAG" streamtv.apk -y > /dev/null 2>&1 || true
            echo "Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish latest stv.apk "STV latest" "--prerelease=false --latest"
          fi
          publish preview stv-preview.apk "STV preview" "--prerelease --latest=false"
