name: TV screenshots
# Steps: "name:KEYS;..." and "restart:" to begin again from Live TV. Run by hand only: builds the debug app, opens it on an Android TV emulator with the test
# playlist, walks the screens with the remote's keys and keeps a picture of each. Publishes nothing.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps, "name:KEY KEY;name:KEY" (DPAD_UP, DPAD_DOWN, DPAD_LEFT, DPAD_RIGHT, ENTER, BACK)'
        default: 'tabs:DPAD_UP;search:DPAD_LEFT;films:DPAD_LEFT;series:DPAD_LEFT;settings:DPAD_LEFT'
      language:
        description: 'App language'
        default: 'ar'
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug app
        # The emulator is x86; the app itself ships ARM only, so x86 is added for this build alone.
        run: |
          sed -i 's/listOf("armeabi-v7a", "arm64-v8a")/listOf("armeabi-v7a", "arm64-v8a", "x86")/' app/build.gradle.kts
          # A version newer than any release, so no "update available" mark shows in the pictures.
          GITHUB_RUN_NUMBER=999999 ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the screens on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STEPS: ${{ inputs.steps }}
          LANGUAGE: ${{ inputs.language }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: .github/screens/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
      # The pictures also go to a one-commit "screens" branch, readable with plain git.
      - name: Keep the pictures on the screens branch
        if: always()
        run: |
          cd shots
          git init -q -b screens
          git -c user.name=ci -c user.email=ci@stv add -A
          git -c user.name=ci -c user.email=ci@stv commit -qm "Screens of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screens

